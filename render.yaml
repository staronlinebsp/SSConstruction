services:
  - type: web
    name: ss-construction-workspace
    runtime: python
    plan: 0.5c-512mb
    buildCommand: python -m py_compile server.py
    startCommand: python server.py serve --host 0.0.0.0
    healthCheckPath: /login
    disk:
      name: workspace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SS_DB_PATH
        value: /var/data/workspace.sqlite3
      - key: SS_SECURE_COOKIE
        value: '1'
      - key: PYTHON_VERSION
        value: 3.13.4
